<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag: Ads conversion tracking (AW-18359088538) + GA4 (G-FJSKKZF4H4,
         property 550865487, account "Forgali" under daniel@forgali.com).
         One gtag.js instance serves both targets; each gets its own config line.
         Keep OUTSIDE the routehead markers so middleware.ts head injection never
         touches it.

         CSP: vercel.json must allowlist *.google-analytics.com AND
         *.analytics.google.com in connect-src. google-analytics.com is a DIFFERENT
         registrable domain from google.com, so the *.google.com entry does NOT
         cover it — without those two, gtag.js loads fine, every /g/collect beacon
         is blocked, and GA4 shows an empty property with no error anywhere. That
         is exactly how the Meta pixel silently failed here in August 2026.

         SPA route changes are NOT tracked from application code on purpose. GA4
         Enhanced measurement ("Page changes based on browser history events", on
         by default) already fires page_view on every React Router navigation.
         Adding a second useLocation-driven page_view on top of it double-counts
         every navigation — the single most common way an SPA's GA4 numbers go
         wrong, and the number this property exists to get right. If that
         Enhanced measurement setting is ever turned OFF, a manual hook has to be
         added back at the same time, not before.
         Known trade-off: Enhanced measurement reads document.title at history-
         change time, which is before react-helmet-async updates it, so GA4 page
         TITLES lag by one navigation. Page PATHS are correct. Read GA4's Pages
         report by "Page path and screen class", never by page title.

         The Purchase event does NOT live in this repo: checkout runs on Shopify's
         domain, so it fires from a Shopify custom pixel (admin → Settings →
         Customer events) on checkout_completed. -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18359088538"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18359088538');
      gtag('config', 'G-FJSKKZF4H4');
    </script>

    <!-- Meta Pixel (1007312825634568). Same rules as the Google tag above:
         keep OUTSIDE the routehead markers so middleware.ts head injection
         never touches it, and CSP in vercel.json must allowlist
         connect.facebook.net (script-src) + www.facebook.com (connect-src)
         or this loads nothing and reports no error.
         This snippet fires PageView on the initial HTML load ONLY — SPA route
         changes are handled by src/components/MetaPixel.tsx.
         The Purchase event does NOT live in this repo: checkout runs on
         Shopify's domain, so purchases are sent server-side from meta-bot. -->
    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1007312825634568');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code. Meta's snippet ships a <noscript> fallback <img>
         alongside this script — it lives at the top of <body> instead, because
         an <img> inside <noscript> inside <head> is an HTML parse error that
         hard-fails the Vite build. Do not move it back up here. -->

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- No static meta description: every route sets its own via <Seo> (react-helmet-async).
         A static one here DUPLICATES rather than gets replaced — JS-rendering crawlers then
         see two description tags and may pick the generic one. The static og:/twitter tags
         below stay as the fallback for non-JS social scrapers on routes middleware.ts
         doesn't rewrite (homepage, static pages). -->
    <meta name="author" content="Forgali" />
    <meta property="og:site_name" content="Forgali" />

    <!-- Sitewide brand identity (site name + logo) for Google. Lives OUTSIDE the
         routehead markers so it survives middleware.ts head injection and never
         collides with per-route JSON-LD (Helmet/middleware emit their own blocks;
         multiple ld+json scripts per page are valid). -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://www.forgali.com/#website","url":"https://www.forgali.com/","name":"Forgali","publisher":{"@id":"https://www.forgali.com/#organization"}},{"@type":"OnlineStore","@id":"https://www.forgali.com/#organization","name":"Forgali","url":"https://www.forgali.com/","logo":"https://cdn.shopify.com/s/files/1/0972/6492/6995/files/forgali-logo-dark.png?v=1787862589","email":"daniel@forgali.com","telephone":"+1-647-527-2110","contactPoint":{"@type":"ContactPoint","contactType":"customer service","telephone":"+1-647-527-2110","email":"daniel@forgali.com","availableLanguage":["English"]},"areaServed":{"@type":"Country","name":"Canada"}}]}
    </script>

    <!-- Everything between the routehead markers is REPLACED per-URL by
         middleware.ts on /product, /category and /plank-and-beam requests, so
         those routes carry their real title/description/canonical/OG/JSON-LD in
         the initial HTML. Vite keeps HTML comments in the build (verified on the
         live shell); if these markers ever disappear, middleware fails open and
         serves this block unchanged. Keep the marker text EXACT. -->
    <!-- routehead:start -->
    <title>Forgali — Solid Wood Furniture for Every Room</title>
    <meta property="og:title" content="Forgali — Solid Wood Furniture for Every Room" />
    <meta property="og:description" content="Solid wood furniture families trust — from bunk beds to dining tables. Free Canada-wide shipping." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0972/6492/6995/files/forgali-og-image.png?v=1787862592" />
    <meta property="og:url" content="https://www.forgali.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Forgali" />
    <meta name="twitter:title" content="Forgali — Solid Wood Furniture for Every Room" />
    <meta name="twitter:description" content="Solid wood furniture families trust — from bunk beds to dining tables. Free Canada-wide shipping." />
    <meta name="twitter:image" content="https://cdn.shopify.com/s/files/1/0972/6492/6995/files/forgali-og-image.png?v=1787862592" />
    <!-- routehead:end -->
  </head>

  <body>
    <!-- Meta Pixel <noscript> fallback (1007312825634568). Belongs in <body>;
         see the note beside the pixel script in <head>. -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=1007312825634568&ev=PageView&noscript=1"
    /></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
