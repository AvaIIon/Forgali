<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- No static meta description: every route sets its own via <Seo> (react-helmet-async).
         A static one here DUPLICATES rather than gets replaced — JS-rendering crawlers then
         see two description tags and may pick the generic one. The static og:/twitter tags
         below stay as the fallback for non-JS social scrapers on routes middleware.ts
         doesn't rewrite (homepage, static pages). -->
    <meta name="author" content="Forgali" />
    <meta property="og:site_name" content="Forgali" />

    <!-- Sitewide brand identity (site name + logo) for Google. Lives OUTSIDE the
         routehead markers so it survives middleware.ts head injection and never
         collides with per-route JSON-LD (Helmet/middleware emit their own blocks;
         multiple ld+json scripts per page are valid). -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://www.forgali.com/#website","url":"https://www.forgali.com/","name":"Forgali","publisher":{"@id":"https://www.forgali.com/#organization"}},{"@type":"OnlineStore","@id":"https://www.forgali.com/#organization","name":"Forgali","url":"https://www.forgali.com/","logo":"https://cdn.shopify.com/s/files/1/0972/6492/6995/files/forgali-logo-dark.png?v=1783621771","email":"support@forgali.com","contactPoint":{"@type":"ContactPoint","contactType":"customer service","email":"support@forgali.com","availableLanguage":["English"]},"areaServed":{"@type":"Country","name":"Canada"}}]}
    </script>

    <!-- Everything between the routehead markers is REPLACED per-URL by
         middleware.ts on /product, /category and /plank-and-beam requests, so
         those routes carry their real title/description/canonical/OG/JSON-LD in
         the initial HTML. Vite keeps HTML comments in the build (verified on the
         live shell); if these markers ever disappear, middleware fails open and
         serves this block unchanged. Keep the marker text EXACT. -->
    <!-- routehead:start -->
    <title>Forgali — Solid Wood Furniture for Every Room</title>
    <meta property="og:title" content="Forgali — Solid Wood Furniture for Every Room" />
    <meta property="og:description" content="Solid wood furniture families trust — from bunk beds to dining tables. Free Canada-wide shipping." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0972/6492/6995/files/forgali-logo-dark.png?v=1783621771" />
    <meta property="og:url" content="https://www.forgali.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Forgali" />
    <meta name="twitter:title" content="Forgali — Solid Wood Furniture for Every Room" />
    <meta name="twitter:description" content="Solid wood furniture families trust — from bunk beds to dining tables. Free Canada-wide shipping." />
    <meta name="twitter:image" content="https://cdn.shopify.com/s/files/1/0972/6492/6995/files/forgali-logo-dark.png?v=1783621771" />
    <!-- routehead:end -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
